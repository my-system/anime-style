<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" fill="none">
  <defs>
    <filter id="brush-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- Ink gradient for hair tip -->
    <linearGradient id="ink-hair" x1="2" y1="2" x2="13" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="30%" stop-color="#181b20"/>
      <stop offset="60%" stop-color="#735338"/>
      <stop offset="85%" stop-color="#d4b996"/>
      <stop offset="100%" stop-color="#f5e8d3"/>
    </linearGradient>
    <!-- Brass ferrule gradient -->
    <linearGradient id="brass-ferrule" x1="9" y1="14" x2="14" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#855d14"/>
      <stop offset="40%" stop-color="#fadb60"/>
      <stop offset="70%" stop-color="#e2ab24"/>
      <stop offset="100%" stop-color="#593b0a"/>
    </linearGradient>
    <!-- Shaft cylindrical wood gradient -->
    <linearGradient id="wood-shaft" x1="12" y1="16" x2="16" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f140e"/>
      <stop offset="35%" stop-color="#54331d"/>
      <stop offset="60%" stop-color="#805333"/>
      <stop offset="85%" stop-color="#402312"/>
      <stop offset="100%" stop-color="#140a06"/>
    </linearGradient>
    <!-- Red cord gradient -->
    <linearGradient id="red-cord" x1="34" y1="34" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <g filter="url(#brush-shadow)">
    <!-- Red Silk Hanging Loop Cord at the tail -->
    <path d="M35 33 C39 29 44 32 42 38 C40 42 36 41 33 36" stroke="url(#red-cord)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="34.5" r="1.2" fill="#b91c1c"/>

    <!-- Bamboo / Wood Handle Shaft -->
    <line x1="12.5" y1="12.5" x2="34.5" y2="34.5" stroke="url(#wood-shaft)" stroke-width="3.8" stroke-linecap="round"/>
    
    <!-- Bamboo Node ring -->
    <ellipse cx="23" cy="23" rx="2.6" ry="1.2" transform="rotate(45 23 23)" fill="#9c6d42" stroke="#2b170c" stroke-width="0.5"/>
    <line x1="21.8" y1="24.2" x2="24.2" y2="21.8" stroke="#fcd34d" stroke-width="0.7" opacity="0.6"/>

    <!-- Tail Cap -->
    <ellipse cx="34.5" cy="34.5" rx="2.4" ry="1.4" transform="rotate(45 34.5 34.5)" fill="#2b170c"/>

    <!-- Ferrule / Brass Band -->
    <polygon points="10,13.5 13.5,10 15,11.5 11.5,15" fill="url(#brass-ferrule)" stroke="#3f270a" stroke-width="0.4"/>
    <line x1="10.8" y1="14.2" x2="14.2" y2="10.8" stroke="#fef08a" stroke-width="0.6"/>

    <!-- Calligraphy Brush Bristles (Tapered MaoBi Hair) -->
    <path d="M2 2 C3.5 4.8 7.5 9.5 10 13.5 L13.5 10 C9.5 7.5 4.8 3.5 2 2 Z" fill="url(#ink-hair)" stroke="#1a1410" stroke-width="0.4" stroke-linejoin="round"/>
    
    <!-- Fine bristle stroke highlights -->
    <path d="M3 3 C4.8 5.8 7.8 9.2 10.5 11.5" stroke="rgba(245, 232, 211, 0.45)" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M2.2 2.2 C3.2 4 4.5 6 5.8 7.5" stroke="#000000" stroke-width="0.9" stroke-linecap="round"/>
    
    <!-- Wet sumi ink sheen at the very tip -->
    <circle cx="2.2" cy="2.2" r="1.1" fill="#090a0f"/>
    <circle cx="2.8" cy="2.8" r="0.4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>