<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" fill="none">
  <defs>
    <filter id="press-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="press-hair" x1="2" y1="2" x2="13" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="35%" stop-color="#16181e"/>
      <stop offset="65%" stop-color="#6e4f34"/>
      <stop offset="85%" stop-color="#c9af8e"/>
      <stop offset="100%" stop-color="#ebdccb"/>
    </linearGradient>
    <linearGradient id="press-brass" x1="9" y1="14" x2="14" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9a6c17"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#69430c"/>
    </linearGradient>
    <linearGradient id="press-wood" x1="12" y1="16" x2="16" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f140e"/>
      <stop offset="40%" stop-color="#613b22"/>
      <stop offset="80%" stop-color="#381d0d"/>
      <stop offset="100%" stop-color="#140a06"/>
    </linearGradient>
  </defs>

  <g filter="url(#press-shadow)">
    <!-- Red cord loop -->
    <path d="M36 33 C40 29 44 32 43 37 C41 41 37 41 34 36" stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="34.5" cy="34.5" r="1.2" fill="#991b1b"/>

    <!-- Bamboo shaft -->
    <line x1="12.5" y1="12.5" x2="34.5" y2="34.5" stroke="url(#press-wood)" stroke-width="4.2" stroke-linecap="round"/>
    
    <!-- Bamboo node -->
    <ellipse cx="23" cy="23" rx="2.8" ry="1.4" transform="rotate(45 23 23)" fill="#aa7a4a" stroke="#2b170c" stroke-width="0.5"/>

    <!-- Brass Ferrule -->
    <polygon points="9.5,13.5 13.5,9.5 15.2,11.2 11.2,15.2" fill="url(#press-brass)" stroke="#2b170c" stroke-width="0.5"/>

    <!-- Pressed Bristles (slightly broader & pressed into ink) -->
    <path d="M2 2 C3 5.5 8 10 10.5 14 L14 10.5 C10 8 5.5 3 2 2 Z" fill="url(#press-hair)" stroke="#110d0a" stroke-width="0.5"/>

    <!-- Wet Ink Droplet & Emerald Catchlight at Tip -->
    <circle cx="2.5" cy="2.5" r="3.2" fill="rgba(34, 197, 94, 0.25)"/>
    <circle cx="2.5" cy="2.5" r="2.2" fill="#090a0f"/>
    <circle cx="2.2" cy="2.2" r="0.8" fill="#22c55e"/>
  </g>
</svg>